issuer = "https://token.actions.githubusercontent.com"
# Immutable subject: owner and repository IDs, so a recreated or renamed repository does not match.
subject = "repo:sorah-rbpkg@19392696/build@1429643459:environment:release"
repositories = ["ruby"]
max_token_lifetime = 3600

# Only the release job of sorah-rbpkg/build's _distro.yml on main, not any job in the release environment.
[claim_pattern]
job_workflow_ref = "sorah-rbpkg/build/\\.github/workflows/_distro\\.yml@refs/heads/main"

[permissions]
contents = "write"
